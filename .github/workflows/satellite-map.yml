name: Render satellite map figures

# Runs on a GitHub-hosted runner, which has open internet access to the Esri
# imagery tile servers and CRAN -- neither is reachable from the sandboxes
# this repo is otherwise developed in, so this workflow is the only place
# the static figures can actually be produced and verified against real
# imagery.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "R/09_satellite_map.R"
      - "bioassay_data_v_final.xlsx"
      - ".github/workflows/satellite-map.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies for sf/terra
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('.github/workflows/satellite-map.yml') }}
          restore-keys: r-pkgs-${{ runner.os }}-

      - name: Install R packages
        run: |
          install.packages(c("readxl", "dplyr", "ggplot2", "tibble",
                             "sf", "maptiles", "tidyterra"))
        shell: Rscript {0}

      - name: Render figures
        run: Rscript R/09_satellite_map.R

      - name: Commit rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/figures/satellite_map_*.png
          git diff --cached --quiet && echo "No change in rendered figures." && exit 0
          git commit -m "Render satellite map figures [skip ci]"
          git push
